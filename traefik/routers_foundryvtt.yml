# ==============================================================================
# FOUNDRYVTT MODULE - TRAEFIK ROUTERS
# ==============================================================================
# Description: Traefik dynamic router and Sablier middleware definitions
# Author: Matt Barham
# Created: 2026-02-12
# Modified: 2026-04-21
# Version: 1.0.1
# Host: Your Server
# ==============================================================================
# Type: Traefik Dynamic Config (routers, middlewares)
# Component: module: foundryvtt
# ==============================================================================

http:
  routers:
    foundryvtt:
      rule: Host(`foundry.{{ env "DOMAIN" }}`)
      entryPoints: "websecure"
      middlewares: sablier-foundryvtt@file,chain-no-auth@file
      service: foundryvtt-svc@file

  middlewares:
    sablier-foundryvtt:
      plugin:
        sablier:
          sablierUrl: http://sablier:10000
          group: foundryvtt
          sessionDuration: 30m
          dynamic:
            displayName: FoundryVTT
            theme: hacker-terminal
            refreshFrequency: 5s
